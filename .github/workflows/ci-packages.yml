# Continuous package channel for downstream work (cohesion-examples first).
#
# Every push to main and every commit to an open same-repository pull request packs the shipped
# platform packages and stages them in the Assimalign GitHub Packages feed at a unique CI version,
# the same shape cohesion's own CI channel uses (cohesion's .github/workflows/ci-packages.yml):
#
#     canonical 10.0.0-preview.1  ->  main: 10.0.0-preview.0.ci.<run>
#                                     PR:   10.0.0-preview.0.pr.<pr>.<run>
#
# Every CI version extends the canonical version's predecessor, so it sorts below the release it
# builds toward.
#
# The packages build against the cohesion CI build that CohesionPackageVersion pins in
# build/Targets/Build.References.Packages.targets, and depend on exactly that version. A consumer
# that pins both repositories' CI builds therefore restores one cohesion build.
#
# This workflow never writes to nuget.org and never publishes a canonical version.
name: CI Packages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.claude/**'
      - 'docs/**'

permissions:
  contents: read

env:
  # The shipped platform packages. Docker is rebuilt as a platform pair before it ships again.
  CI_PACKAGE_PROJECTS: >-
    platforms/Kubernetes/Assimalign.Cohesion.ApplicationModel.Gateway.Kubernetes
    platforms/Kubernetes/Assimalign.Cohesion.ApplicationModel.Hosting.Kubernetes

jobs:
  pack:
    name: pack the platform packages
    # Same-repository pull requests only: a fork's or Dependabot's run gets a read-only token, so its
    # push would fail after the pack. Never trigger this workflow on pull_request_target.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A newer commit on the same pull request cancels a pack in progress, never a publish.
    concurrency:
      group: platforms-ci-packages-pack-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout build commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve CI package version
        id: version
        shell: pwsh
        env:
          COHESION_EVENT_NAME: ${{ github.event_name }}
          COHESION_BUILD_NUMBER: ${{ github.run_number }}
          COHESION_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The canonical version as Build.Version.props derives it: the target framework's major, the
          # minor, and the patch with its prerelease label.
          [xml] $versionProps = Get-Content -Raw build/Targets/Build.Version.props
          [xml] $frameworkProps = Get-Content -Raw build/Targets/Build.TargetFramework.props
          $patch = @($versionProps.Project.PropertyGroup.CohesionPatchVersion | Where-Object { $_ })[0]
          $minor = @($versionProps.Project.PropertyGroup.CohesionMinorVersion | Where-Object { $_ })[0]
          $framework = @($frameworkProps.Project.PropertyGroup.TargetFrameworkLatest | Where-Object { $_ })[0]
          $major = [version]::Parse($framework.Substring(3)).Major
          # The canonical prerelease is <label>.<n>, such as preview.1; its predecessor is <label>.<n-1>.
          if ($patch -notmatch '^(?<core>\d+)-(?<label>[a-z]+)\.(?<number>\d+)$' -or [int] $Matches.number -lt 1) {
            throw "CohesionPatchVersion '$patch' is not <patch>-<label>.<n> with n >= 1."
          }
          $suffix = '{0}.{1}' -f $Matches.label, ([int] $Matches.number - 1)
          $prefix = "$major.$minor.$($Matches.core)"
          if ($env:COHESION_EVENT_NAME -eq 'pull_request') {
            $suffix = "$suffix.pr.$($env:COHESION_PULL_REQUEST_NUMBER).$($env:COHESION_BUILD_NUMBER)"
          }
          else {
            $suffix = "$suffix.ci.$($env:COHESION_BUILD_NUMBER)"
          }
          $commit = (git rev-parse HEAD).Trim()
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "version=$prefix-$suffix" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          Write-Host "CI package version: $prefix-$suffix (commit $commit)"

      # The cohesion packages these build against come from the same feed. The workflow token reads
      # them: packages published from public assimalign repositories are readable with any valid token.
      - name: Add GitHub Packages source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name github --username "${{ github.actor }}" --password $env:GITHUB_TOKEN --store-password-in-clear-text

      - name: Test and pack
        shell: pwsh
        env:
          CI_VERSION_PREFIX: ${{ steps.version.outputs.prefix }}
          CI_VERSION_SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          $output = Join-Path $PWD '_out/ci-packages'
          foreach ($project in $env:CI_PACKAGE_PROJECTS -split '\s+' | Where-Object { $_ }) {
            $name = Split-Path $project -Leaf
            $tests = "$project/tests/$name.Tests.csproj"
            if (Test-Path $tests) {
              dotnet test $tests --configuration Release
              if ($LASTEXITCODE -ne 0) { throw "Testing $name failed." }
            }
            dotnet pack "$project/src/$name.csproj" --configuration Release --output $output `
              "-p:VersionPrefix=$env:CI_VERSION_PREFIX" "-p:VersionSuffix=$env:CI_VERSION_SUFFIX"
            if ($LASTEXITCODE -ne 0) { throw "Packing $name failed." }
          }
          Get-ChildItem $output -Filter *.nupkg | ForEach-Object { Write-Host $_.Name }

      - name: Upload CI packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Assimalign.Cohesion.Platforms.CiPackages
          path: _out/ci-packages/*.nupkg
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish ${{ needs.pack.outputs.version }} to GitHub Packages
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download CI packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Assimalign.Cohesion.Platforms.CiPackages
          path: _ci/packages

      - name: Publish CI packages
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          CI_VERSION: ${{ needs.pack.outputs.version }}
          CI_COMMIT: ${{ needs.pack.outputs.commit }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # A first attempt must create every version; only a re-run of this same run, whose earlier
          # attempt may have stopped partway, may skip the ones already pushed.
          $duplicate = @()
          if ([int] $env:CI_RUN_ATTEMPT -gt 1) { $duplicate = @('--skip-duplicate') }
          $packages = @(Get-ChildItem _ci/packages -Filter *.nupkg)
          if ($packages.Count -eq 0) { throw 'The CI artifact holds no packages.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source 'https://nuget.pkg.github.com/assimalign/index.json' `
              --api-key $env:GITHUB_PACKAGES_TOKEN --no-symbols @duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $($package.Name) failed with exit code $LASTEXITCODE." }
          }
          @"
          ## Published platform CI packages

          | | |
          | --- | --- |
          | Version | ``$env:CI_VERSION`` |
          | Commit | ``$env:CI_COMMIT`` |
          | Packages | $($packages.Count) |

          Reference them at ``$env:CI_VERSION`` from ``https://nuget.pkg.github.com/assimalign/index.json``
          (a token with ``read:packages``).
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
