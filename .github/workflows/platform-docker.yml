name: Platform Docker

on:
  push:
    paths:
      - "platforms/Docker/**"
      - "platforms/Shared/**"
      - "build/**"
      - "global.json"
      - "nuget.config"
      - ".github/actions/build/**"
      - ".github/scripts/**"
      - ".github/workflows/platform-docker.yml"

permissions:
  contents: read
  # Restore reads cohesion's CI packages; publishing is ci-packages.yml's alone.
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects:
          - Assimalign.Cohesion.ApplicationModel.Gateway.Docker
          - Assimalign.Cohesion.ApplicationModel.Hosting.Docker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          area: platforms
          category: Docker
          project: ${{ matrix.projects }}

  # No test project references the end-to-end fixture, so it is built here: a compile break in it
  # shows on the push, not only in the weekly end-to-end run.
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Add GitHub Packages source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name github --username "${{ github.actor }}" --password $env:GITHUB_TOKEN --store-password-in-clear-text
      - name: Build the fixture
        run: dotnet build platforms/Docker/fixtures/WebProgram/WebProgram.csproj --configuration Release
