name: Platform Kubernetes

on:
  push:
    paths:
      - "platforms/Kubernetes/**"
      - "build/**"
      - "global.json"
      - "nuget.config"
      - ".github/actions/build/**"
      - ".github/workflows/platform-kubernetes.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects:
          - Assimalign.Cohesion.ApplicationModel.Gateway.Kubernetes
          - Assimalign.Cohesion.ApplicationModel.Hosting.Kubernetes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          area: platforms
          category: Kubernetes
          project: ${{ matrix.projects }}
          # The Kubernetes pair builds on the application-model restart, which only the cohesion branch
          # of the same name carries (assimalign/cohesion#1759). The repository variable
          # COHESION_SIBLING_REF still names the previous line, which the other platforms build on.
          cohesion-ref: feature/deployment-record-control-plane
