name: credential-guard

on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials in tracked files
        run: |
          set -e
          if git grep -nE 'packageSourceCredentials|ClearTextPassword|ghp_|github_pat_' -- ':!.github/workflows/credential-guard.yml'; then
            echo "::error::credential material is committed; revoke it and remove it from the tree"
            exit 1
          fi
