# The Kubernetes platform end to end on kind: KubernetesEndToEndTests deploys orders-api x2 and a
# storefront through a gateway in the test process, then checks the storefront answers through
# orders-api and a write reaches every instance.
#
# On demand and weekly rather than on every push: the run creates a kind cluster and a registry and
# builds the fixture image, which takes minutes, and the unit tests in platform-kubernetes.yml already
# gate every push. GitHub's hosted runners are x64, so the fixture image is linux-x64 and kind runs on
# the runner's Docker engine (locally, the same scripts run kind on a rootful Podman machine).
name: Platform Kubernetes E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COHESION_KIND_CONTEXT: kind-cohesion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The cohesion packages CohesionPackageVersion pins come from GitHub Packages.
      - name: Add GitHub Packages source
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name github --username "${{ github.actor }}" --password $env:GITHUB_TOKEN --store-password-in-clear-text

      - name: Install kind
        shell: bash
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create the cluster and its registry
        shell: pwsh
        run: ./platforms/Kubernetes/scripts/New-CohesionKindCluster.ps1 -Engine docker

      - name: Publish the fixture image to the registry
        shell: pwsh
        run: ./platforms/Kubernetes/scripts/Publish-CohesionKindFixtures.ps1 -Engine docker

      - name: Run KubernetesEndToEndTests
        shell: pwsh
        run: |
          dotnet test platforms/Kubernetes/Assimalign.Cohesion.ApplicationModel.Gateway.Kubernetes/tests/Assimalign.Cohesion.ApplicationModel.Gateway.Kubernetes.Tests.csproj `
            --configuration Release `
            --filter 'FullyQualifiedName~KubernetesEndToEndTests' `
            --logger 'trx;LogFileName=kind.trx' --results-directory "$env:RUNNER_TEMP/kind-results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A skipped test passes dotnet test; the run counts only when the test executed and passed.
          [xml] $results = Get-Content -Raw "$env:RUNNER_TEMP/kind-results/kind.trx"
          $counters = $results.TestRun.ResultSummary.Counters
          if ($counters.executed -ne '1' -or $counters.passed -ne '1') {
            throw "Expected KubernetesEndToEndTests to execute and pass once; it executed $($counters.executed) and passed $($counters.passed)."
          }
          'KubernetesEndToEndTests: executed and passed.' >> $env:GITHUB_STEP_SUMMARY

      - name: Delete the cluster
        if: always()
        shell: bash
        run: |
          kind delete cluster --name cohesion || true
          docker rm -f cohesion-registry || true
