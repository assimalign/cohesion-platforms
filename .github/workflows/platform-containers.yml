name: Platform Containers

on:
  push:
    paths:
      - "platforms/Containers/**"
      - "build/**"
      - "global.json"
      - "nuget.config"
      - ".github/actions/build/**"
      - ".github/workflows/platform-containers.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects:
          - Assimalign.Cohesion.ApplicationModel.Gateway.Containers
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          area: platforms
          category: Containers
          project: ${{ matrix.projects }}
          cohesion-ref: ${{ vars.COHESION_SIBLING_REF }}
