name: "Cohesion Platforms Build"
description: "Restores, builds, and tests one platform project. Publishing is ci-packages.yml's alone."

inputs:
  area:
    description: "Top-level tree the project lives in (e.g. platforms)."
    required: true
  category:
    description: "Area folder name (e.g. Kubernetes, Docker)."
    required: true
  project:
    description: "Project/assembly name (e.g. Assimalign.Cohesion.ApplicationModel.Gateway.Kubernetes)."
    required: true
  cohesion-ref:
    description: >-
      When set, build against a sibling checkout of assimalign/cohesion at this ref (branch, tag or SHA)
      instead of the pinned CI packages: .github/scripts/Pack-CohesionSibling.ps1 clones it to ../cohesion,
      packs the consumed package closure into its _out/packages at cohesion's .local version, and reports
      that version, which restore, build and test receive as CohesionSiblingPackageVersion. Empty means
      the CohesionPackageVersion pin in build/Targets/Build.References.Packages.targets.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup .NET (from global.json)
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Pack the sibling cohesion checkout
      id: sibling
      if: ${{ inputs.cohesion-ref != '' }}
      shell: pwsh
      run: ./.github/scripts/Pack-CohesionSibling.ps1 -Ref "${{ inputs.cohesion-ref }}"

    # Assimalign.Cohesion.* packages come from the GitHub Packages staging feed. The workflow
    # GITHUB_TOKEN authenticates (packages published from public assimalign repos are readable
    # with any valid token).
    - name: Add GitHub Packages source
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
          --name github --username "${{ github.actor }}" --password $env:GITHUB_TOKEN --store-password-in-clear-text

    - name: Build
      shell: pwsh
      env:
        COHESION_SIBLING_VERSION: ${{ steps.sibling.outputs.version }}
      run: |
        $sibling = if ($env:COHESION_SIBLING_VERSION) { @("-p:CohesionSiblingPackageVersion=$env:COHESION_SIBLING_VERSION") } else { @() }
        $project = "./${{ inputs.area }}/${{ inputs.category }}/${{ inputs.project }}/src/${{ inputs.project }}.csproj"
        dotnet restore $project @sibling
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build $project --configuration Release --no-restore @sibling

    - name: Test
      if: ${{ hashFiles(format('./{0}/{1}/{2}/tests/{2}.Tests.csproj', inputs.area, inputs.category, inputs.project)) != '' }}
      shell: pwsh
      env:
        COHESION_SIBLING_VERSION: ${{ steps.sibling.outputs.version }}
      run: |
        $sibling = if ($env:COHESION_SIBLING_VERSION) { @("-p:CohesionSiblingPackageVersion=$env:COHESION_SIBLING_VERSION") } else { @() }
        $project = "./${{ inputs.area }}/${{ inputs.category }}/${{ inputs.project }}/tests/${{ inputs.project }}.Tests.csproj"
        dotnet restore $project @sibling
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test $project --configuration Release --no-restore @sibling
