version: "3.9"
name: "appa"
services:
  "appa-appa-api":
    container_name: "appa-appa-api"
    image: "registry.example/test@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    restart: "no"
    environment:
      "COHESION_APPLICATION": "appa"
      "COHESION_CONTENT_ROOT": "/app"
      "COHESION_ENDPOINT_HTTPS_HOST": "0.0.0.0"
      "COHESION_ENDPOINT_HTTPS_PORT": "8443"
      "COHESION_ENDPOINT_HTTPS_PUBLIC_URL": "https://localhost:8443"
      "COHESION_ENDPOINT_HTTPS_SCHEME": "https"
      "COHESION_ENDPOINT_HTTP_HOST": "0.0.0.0"
      "COHESION_ENDPOINT_HTTP_PORT": "8080"
      "COHESION_ENDPOINT_HTTP_SCHEME": "http"
      "COHESION_ENVIRONMENT": "Development"
      "COHESION_GATEWAY": "docker"
      "COHESION_MOUNT_TLS_PATH": "/cohesion/mounts/tls"
      "COHESION_RESOURCE": "appa-api"
      "CUSTOM_VALUE": "preserved"
    labels:
      "cohesion.io/application": "appa"
      "cohesion.io/owner": "appa@docker"
      "cohesion.io/plan-hash": "ec5f09d8b278ed2a60f039e0aa93549a5b933f160b7444789d8f99c877948dd2"
      "cohesion.io/resource": "appa-api"
      "cohesion.io/runtime-hash": "066f2c7995a24fabcd67f516d68cf9fbedc6ce41529d3d85f10d91fca4d8f96a"
    networks:
      "cohesion-appa":
        aliases:
          - "appa-api"
          - "appa-api-http"
          - "appa-api-https"
    tmpfs:
      - "/cohesion/mounts:rw,noexec,nosuid,nodev,mode=0700"
    ports:
      - "0.0.0.0:8443:8443/tcp"
      - "127.0.0.1:0:8443/tcp"
      - "127.0.0.1:0:8080/tcp"
    x-cohesion:
      restart_policy: "OnFailure"
      restart_owner: "gateway"
      workload: "Deployment"
      run_once: false
      stop_grace_seconds: 30
      plan_hash: "ec5f09d8b278ed2a60f039e0aa93549a5b933f160b7444789d8f99c877948dd2"
      inputs:
        - path: "/cohesion/mounts/tls"
          sensitive: true
      probes:
        - role: "readiness"
          kind: "Http"
          endpoint: "https"
          value: "/readyz"
        - role: "liveness"
          kind: "Tcp"
          endpoint: "http"
  "appa-appa-database":
    container_name: "appa-appa-database"
    image: "registry.example/test@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    restart: "no"
    environment:
      "COHESION_APPLICATION": "appa"
