      "COHESION_ENDPOINT_ADMIN_SCHEME": "http"
      "COHESION_ENDPOINT_DB_HOST": "0.0.0.0"
      "COHESION_ENDPOINT_DB_PORT": "5432"
      "COHESION_ENDPOINT_DB_SCHEME": "tcp"
      "COHESION_ENVIRONMENT": "Development"
      "COHESION_GATEWAY": "docker"
      "COHESION_MOUNT_DATA_PATH": "/var/lib/database"
      "COHESION_RESOURCE": "appa-database"
    labels:
      "cohesion.io/application": "appa"
      "cohesion.io/owner": "appa@docker"
      "cohesion.io/plan-hash": "7f897ed3528639f4e505fcddbc91173498e4d9a55f395b3fa5750293adbfb5e9"
      "cohesion.io/resource": "appa-database"
      "cohesion.io/runtime-hash": "2a693789252bd6c7b33f7b2430c6168ad5d3916d1b330a78559a3e5c31149b17"
    networks:
      "cohesion-appa":
        aliases:
          - "appa-database"
          - "appa-database-db"
          - "appa-database-admin"
          - "appa-database-headless"
    volumes:
      - "appa-appa-database-data:/var/lib/database"
    ports:
      - "127.0.0.1:0:8080/tcp"
    x-cohesion:
      restart_policy: "OnFailure"
      restart_owner: "gateway"
      workload: "StatefulSet"
      run_once: false
      stop_grace_seconds: 30
      plan_hash: "7f897ed3528639f4e505fcddbc91173498e4d9a55f395b3fa5750293adbfb5e9"
